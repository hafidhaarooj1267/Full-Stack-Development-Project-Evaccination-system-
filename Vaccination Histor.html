<body>
<div class="animated-bg"></div>
<div class="floating-shapes">
    <div class="shape-bg-1"></div>
    <div class="shape-bg-2"></div>
    <div class="shape-bg-3"></div>
    <div class="shape-bg-4"></div>
</div>
    <div class="dashboard">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2><i class="fas fa-syringe"></i> VaxCare</h2>
            <ul>
                <li><a href="/pages/My Children.html"><i class="fas fa-child"></i> <span>My Children</span></a></li>
                <li><a href="/pages/Book Appointment.html"><i class="fas fa-calendar-check"></i> <span>Book
                            Appointment</span></a></li>
                <li class="active"><a href="/pages/Vaccination Histor.html"><i class="fas fa-history"></i>
                        <span>Vaccination History</span></a></li>
                <li onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="page-header">
                <h1><i class="fas fa-history"></i> Vaccination History</h1>
            </div>

            <!-- Stats Summary -->
            <div class="stats" id="statsContainer">
                <div class="stat-card">
                    <div class="stat-number" id="totalCount">0</div>
                    <div>Total Appointments</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completedCount">0</div>
                    <div>Completed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="scheduledCount">0</div>
                    <div>Scheduled</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters">
                <div class="filter-group">
                    <label>Filter by Child</label>
                    <select id="filterChild">
                        <option value="all">All Children</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Filter by Status</label>
                    <select id="filterStatus">
                        <option value="all">All</option>
                        <option value="Scheduled">Scheduled</option>
                        <option value="Completed">Completed</option>
                        <option value="Missed">Missed</option>
                    </select>
                </div>
                <button class="btn-filter" id="applyFilterBtn"><i class="fas fa-search"></i> Apply Filter</button>
                <button class="btn-filter" id="printBtn" style="background:#17C3B2;"><i class="fas fa-print"></i>
                    Print</button>
            </div>

            <!-- History Table -->
            <div class="history-table">
                <table id="historyTable">
                    <thead>
                        <tr>
                            <th>Child Name</th>
                            <th>Vaccine</th>
                            <th>Hospital</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="7" class="empty-state">No appointments found. Book your first appointment!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
