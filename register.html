<body>
    <div class="floating-bubbles" id="bubbles"></div>
    <div class="register-container">
        <div class="logo"><i class="fas fa-shield-virus"></i> ImmunoTrack</div>
        <h2>Create free account</h2>
        <form id="registerForm">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="fullname" placeholder="Full Name" required>
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <i class="fas fa-phone-alt"></i>
                <input type="tel" id="phone" placeholder="Phone Number" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <div class="input-group">
                <i class="fas fa-user-tag"></i>
                <select id="role" required>
                    <option value="">I am a...</option>
                    <option value="parent">Parent</option>
                    <option value="hospital">Hospital Representative</option>
                    <!-- Admin registration not exposed publicly -->
                </select>
            </div>
            <button type="submit" class="btn-register"><i class="fas fa-user-plus"></i> Register</button>
            <div id="registerMsg" class="error-msg"></div>
        </form>
        <div class="login-link">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>
