<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ImmunoTrack</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/frontend.css">
</head>

<body>
    
<body>

    <div
        style=" margin-right:100px; display: flex; justify-content: center; align-items: center; min-height: 100vh; width: 100vw; position: relative; z-index: 5; padding: 20px;">

        <div class="login-container">
            <div class="logo"><i class="fas fa-shield-virus"></i> ImmunoTrack</div>
            <h2>Welcome back</h2>
            <form id="loginForm">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email address" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-user-tag"></i>
                    <select id="role" required>
                        <option value="">Select role</option>
                        <option value="parent">Parent</option>
                        <option value="hospital">Hospital</option>

                    </select>
                </div>
                <button type="submit" class="btn-login"><i class="fas fa-arrow-right-to-bracket"></i> Login</button>
                <div id="loginError" class="error-msg"></div>
            </form>
            <div class="register-link">
                Don't have an account? <a href="register.html">Create one</a>
            </div>
        </div>
    </div>

 
    <script src="js/frontend.js"></script>
</body>

</html>
