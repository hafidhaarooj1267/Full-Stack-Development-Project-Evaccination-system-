<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ImmunoTrack</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/frontend.css">
</head>

<body>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <div class="login-container">
        <div class="logo"><i class="fas fa-shield-virus"></i> ImmunoTrack</div>
        <h2>Welcome back</h2>
        <form id="loginForm">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="Email address" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <div class="input-group">
                <i class="fas fa-user-tag"></i>
                <select id="role" required>
                    <option value="">Select role</option>
                    <option value="parent">Parent</option>
                    <option value="hospital">Hospital</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn-login"><i class="fas fa-arrow-right-to-bracket"></i> Login</button>
            <div id="loginError" class="error-msg"></div>
        </form>
        <div class="register-link">
            Don't have an account? <a href="register.html">Create one</a>
        </div>
    </div>

 
    <script src="js/frontend.js"></script>
</body>

</html>
