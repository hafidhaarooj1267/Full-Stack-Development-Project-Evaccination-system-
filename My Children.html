<div class="floating-shapes">

    <div class="dashboard">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2><i class="fas fa-syringe"></i> VaxCare</h2>
            <ul>
                <li><a href="/pages/Book Appointment.html"><i class="fas fa-tachometer-alt"></i>

                <li><a href="/pages/My Children.html"><i class="fas fa-child"></i> <span>My Children</span></a></li>

            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="page-header">
                <h1><i class="fas fa-child"></i> My Children</h1>
                <button class="btn-add" id="openAddModalBtn"><i class="fas fa-plus"></i> Add Child</button>
            </div>

            <div id="childrenContainer" class="children-grid">
                <!-- Dynamic children cards will appear here -->
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="childModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Add New Child</h2>
            <input type="text" id="childName" placeholder="Child's Full Name" required>
            <input type="date" id="childDOB" required>
            <select id="childBloodGroup">
                <option value="">Select Blood Group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>O+</option>
                <option>O-</option>
                <option>AB+</option>
                <option>AB-</option>
            </select>
            <input type="text" id="childAllergies" placeholder="Allergies (if any)">
            <div class="modal-buttons">
                <button class="btn-cancel" id="closeModalBtn">Cancel</button>
                <button class="btn-save" id="saveChildBtn">Save</button>
            </div>
        </div>
    </div>
